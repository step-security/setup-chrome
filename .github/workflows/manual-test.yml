name: 'Run test manually'
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to run test on'
        required: true
        type: choice
        options:
        - ubuntu
        - windows
        - macos
      container:
        description: 'Container image to run test on'
        required: false
        type: string
      chrome-version:
        description: 'Chrome version to install'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test:
    needs: [build]
    runs-on: ${{ inputs.os }}-latest
    container: ${{ inputs.container }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install chrome
        uses: ./
        with:
          chrome-version: ${{ inputs.chrome-version }}
        id: setup-chrome
      - if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version
      - if: runner.os == 'Windows'
        run: |
          (Get-Item (Get-Command "${{ steps.setup-chrome.outputs.chrome-path }}").Source).VersionInfo.ProductVersion
          (Get-Item (Get-Command "${{ steps.setup-chrome.outputs.chromedriver-path }}").Source).VersionInfo.ProductVersion
